services:
  postgres:
    image: postgres:16-alpine
    container_name: ecolife-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecolife
      POSTGRES_PASSWORD: ecolife
      POSTGRES_DB: ecolife
    ports:
      - "5432:5432"
    volumes:
      - ecolife_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecolife -d ecolife"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:4
    container_name: ecolife-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ecolife_pgdata_dev:
    name: ecolife_pgdata_dev
