# EcoLife reverse proxy — TLS-ready (HTTP + ACME + optional HTTPS)
# Mount Let's Encrypt certs at /etc/letsencrypt when ready.

# ── Compression ──────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  application/json
  application/javascript
  text/css
  text/plain
  text/html
  image/svg+xml;

upstream ecolife_api {
    server api:3000;
}

upstream ecolife_admin {
    server admin:80;
}


# --- HTTP (bootstrap + ACME challenge) ---
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Certbot / ACME HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment after obtaining certificates to force HTTPS:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # API + webhooks (Payme / Click under /api/v1/payments/webhooks/*)
    location /api/ {
        proxy_pass http://ecolife_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://ecolife_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA
    location /admin/ {
        proxy_pass http://ecolife_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = / {
        return 302 /admin/;
    }
}

