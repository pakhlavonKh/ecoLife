# Proxy API through the site origin → VPS (HTTPS). Prefer this over cleartext
# HTTP: Netlify→:80 timeouts often surface in the browser as 500 on /api/*.
# Must be above the SPA fallback. Leave VITE_API_URL empty to use this proxy,
# or set VITE_API_URL=https://api.eco-life-etiqod.com to bypass the proxy.
[[redirects]]
  from = "/api/*"
  to = "https://api.eco-life-etiqod.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[plugins]]
  package = "netlify-plugin-cloudinary"

  [plugins.inputs]
    cloudName = "ECOLIFE_CLOUD_IMAGES"
    folder = "src/assets"
